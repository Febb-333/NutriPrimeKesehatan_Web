{% extends "base.html" %}
{% block title %}Kontak Kami — NutriPrimeKesehatan{% endblock %}

{% block content %}
<section class="section" style="padding-top: 3.5rem;">
  <div class="container">
    <div class="text-center mb-5">
      <span class="eyebrow"><i class="bi bi-envelope"></i> Hubungi Kami</span>
      <h1 class="mt-3 mb-2" style="font-size: clamp(1.8rem, 3vw, 2.4rem);">Ada Pertanyaan atau Masukan?</h1>
      <p class="text-muted-soft" style="max-width:560px; margin-inline:auto;">
        Kirimkan pesan Anda, kami akan berusaha merespons secepatnya.
      </p>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="hero-visual-card">
          <form method="POST" action="/contact" novalidate>
            <div class="mb-3">
              <label class="form-label fw-semibold">Nama</label>
              <input type="text" class="form-control" name="name" placeholder="Nama Anda"
                     value="{{ form_data.get('name', '') }}" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" class="form-control" name="email" placeholder="email@contoh.com"
                     value="{{ form_data.get('email', '') }}" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Subjek</label>
              <input type="text" class="form-control" name="subject" placeholder="Topik pesan Anda"
                     value="{{ form_data.get('subject', '') }}" required>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Pesan</label>
              <textarea class="form-control" name="message" rows="5" placeholder="Tulis pesan Anda di sini..." required>{{ form_data.get('message', '') }}</textarea>
            </div>
            <button type="submit" class="btn btn-nutriprime-primary w-100">
              <i class="bi bi-send me-1"></i> Kirim Pesan
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
