{% extends "base.html" %}
{% block title %}Login Admin — NutriPrimeKesehatan{% endblock %}

{% block content %}
<section class="section d-flex align-items-center" style="min-height: 60vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-4 col-md-6">
        <div class="hero-visual-card">
          <div class="text-center mb-4">
            <div class="feature-icon mx-auto mb-3" style="width:60px; height:60px; font-size:1.6rem;">
              <i class="bi bi-shield-lock"></i>
            </div>
            <h5 class="mb-1">Login Admin</h5>
            <p class="text-muted-soft mb-0" style="font-size:0.9rem;">Masuk untuk mengelola data website</p>
          </div>
          <form method="POST" action="/admin/login" novalidate>
            <div class="mb-3">
              <label class="form-label fw-semibold">Username</label>
              <input type="text" class="form-control" name="username" placeholder="admin" required autofocus>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" class="form-control" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-nutriprime-primary w-100">
              <i class="bi bi-box-arrow-in-right me-1"></i> Login
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
